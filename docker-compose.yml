services:
  nexa:
    build: .
    container_name: nexa-cursos
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=5000
      - APP_URL=${APP_URL:-http://localhost:5000}
      - AUTH_SECRET=${AUTH_SECRET:-cambia-este-secreto-de-sesion}
      - STREAM_SECRET=${STREAM_SECRET:-cambia-este-secreto-de-stream}
      - MP_PUBLIC_KEY=${MP_PUBLIC_KEY:-}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN:-}
      - MP_ALLOW_SIMULATE=${MP_ALLOW_SIMULATE:-true}
      - DataPath=/app/data/store.json
      - VideoPath=/app/content/videos
    volumes:
      - nexa_data:/app/data
      - ./content/videos:/app/content/videos:ro
    restart: unless-stopped

volumes:
  nexa_data:
