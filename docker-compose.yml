services:
  nexa:
    build: .
    container_name: nexa-cursos
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - APP_URL=${APP_URL:-http://localhost:3000}
      - AUTH_SECRET=${AUTH_SECRET:-cambia-este-secreto-de-sesion}
      - STREAM_SECRET=${STREAM_SECRET:-cambia-este-secreto-de-stream}
      - MP_PUBLIC_KEY=${MP_PUBLIC_KEY:-}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN:-}
      - MP_ALLOW_SIMULATE=${MP_ALLOW_SIMULATE:-true}
    volumes:
      - nexa_data:/app/data
      - ./content/videos:/app/content/videos:ro
    restart: unless-stopped

volumes:
  nexa_data:
