<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEXA — Cursos y certificaciones</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main>
    <section class="hero">
      <div class="wrap hero-copy">
        <p class="brand-mark">NEXA</p>
        <h1>Cursos con video protegido y certificación.</h1>
        <p>Comprá, aprendé en el aula cifrada y obtené tu certificado. Pagos con Mercado Pago o simulación en local.</p>
        <div class="cta-row">
          <a class="btn btn-accent" href="/cursos.html">Ver cursos</a>
          <a class="btn btn-ghost" href="/login.html">Ingresar</a>
        </div>
      </div>
    </section>
    <section class="section">
      <div class="wrap">
        <h2>Catálogo</h2>
        <p class="lead">Tres programas listos para demo. El video viaja cifrado al navegador.</p>
        <div class="course-list" id="homeCourses"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="wrap">NEXA · demo@nexa.academy / demo1234</div></footer>
  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const { courses } = await api("/api/courses");
      document.getElementById("homeCourses").innerHTML = courses.slice(0, 3).map((c) => `
        <a class="course-row" href="/curso.html?slug=${c.slug}">
          <span class="bar" style="background:${c.thumbnailGradient}"></span>
          <div>
            <h3>${c.title}</h3>
            <p>${c.subtitle}</p>
            <div class="meta">${c.level} · ${c.durationHours} h · ${c.instructor}</div>
          </div>
          <div class="price">${money(c.price, c.currency)}</div>
        </a>`).join("");
    })();
  </script>
</body>
</html>
