<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar · NEXA</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="section"><div class="wrap">
    <h2>Ingresar</h2>
    <p class="lead">Demo: demo@nexa.academy / demo1234</p>
    <form class="form panel" id="form">
      <label>Email <input name="email" type="email" required value="demo@nexa.academy" /></label>
      <label>Contraseña <input name="password" type="password" required value="demo1234" /></label>
      <button class="btn btn-primary" type="submit">Entrar</button>
      <p class="error" id="err"></p>
      <p class="hint">¿No tenés cuenta? <a href="/registro.html">Registrate</a></p>
    </form>
  </div></main>
  <script src="/js/common.js"></script>
  <script>
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ email: fd.get("email"), password: fd.get("password") }),
        });
        location.href = "/mis-cursos.html";
      } catch (err) {
        document.getElementById("err").textContent = err.message;
      }
    };
  </script>
</body>
</html>
