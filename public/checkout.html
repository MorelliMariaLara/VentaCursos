<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout · NEXA</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="section"><div class="wrap grid-2">
    <div>
      <h2 id="title">Checkout</h2>
      <p class="lead" id="subtitle"></p>
      <p class="price" id="price" style="font-size:1.4rem"></p>
      <p class="hint" id="statusMsg"></p>
    </div>
    <div class="panel">
      <div id="brick"></div>
      <button class="btn btn-accent" id="simulateBtn" type="button" style="display:none;width:100%;margin-top:0.8rem">
        Simular pago (demo local)
      </button>
      <p class="error" id="err"></p>
    </div>
  </div></main>
  <script src="/js/common.js"></script>
  <script>
    let orderId = null;
    let slug = qs("slug");
    const status = qs("status");

    (async () => {
      if (!slug) return location.href = "/cursos.html";
      if (status) {
        document.getElementById("statusMsg").textContent = "Estado del pago: " + status;
      }
      const user = await getUser();
      if (!user) return location.href = "/login.html";

      const data = await api("/api/courses/" + encodeURIComponent(slug));
      if (data.enrolled) return location.href = "/aprender.html?slug=" + slug;
      document.getElementById("title").textContent = data.course.title;
      document.getElementById("subtitle").textContent = "Pago seguro · Mercado Pago";
      document.getElementById("price").textContent = data.priceLabel;

      const cfg = await api("/api/payments/config");
      const pref = await api("/api/payments/preference", {
        method: "POST",
        body: JSON.stringify({ slug }),
      });
      orderId = pref.orderId;

      const simBtn = document.getElementById("simulateBtn");
      if (cfg.simulate || pref.simulateOnly) {
        simBtn.style.display = "inline-flex";
        simBtn.onclick = async () => {
          try {
            const result = await api("/api/payments/process", {
              method: "POST",
              body: JSON.stringify({ orderId, simulate: true }),
            });
            location.href = result.redirect;
          } catch (e) {
            document.getElementById("err").textContent = e.message;
          }
        };
      }

      if (cfg.configured && cfg.publicKey && pref.preferenceId) {
        const s = document.createElement("script");
        s.src = "https://sdk.mercadopago.com/js/v2";
        s.onload = async () => {
          const mp = new MercadoPago(cfg.publicKey, { locale: "es-AR" });
          const bricks = mp.bricks();
          await bricks.create("payment", "brick", {
            initialization: {
              amount: data.course.price,
              preferenceId: pref.preferenceId,
            },
            callbacks: {
              onSubmit: async ({ formData }) => {
                const result = await api("/api/payments/process", {
                  method: "POST",
                  body: JSON.stringify({ orderId, formData }),
                });
                location.href = result.redirect;
              },
              onError: (err) => {
                document.getElementById("err").textContent = err?.message || "Error en Mercado Pago";
              },
            },
          });
        };
        document.body.appendChild(s);
      } else if (!cfg.simulate && !pref.simulateOnly) {
        document.getElementById("err").textContent = "Configurá MP_PUBLIC_KEY y MP_ACCESS_TOKEN en .env";
      }
    })().catch((e) => {
      if (e.status === 401) location.href = "/login.html";
      else document.getElementById("err").textContent = e.message;
    });
  </script>
</body>
</html>
